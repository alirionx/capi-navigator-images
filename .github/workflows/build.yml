name: Build node images

# Manual trigger only: builds Cluster API node images for kubeadm from stock cloud images
# (virt-customize), boots each one like CAPMOX does and runs `kubeadm init` as smoke test.
# Images are workflow artifacts (short retention); with `release` they also become assets of a
# GitHub release (one per run, all images plus SHA256SUMS).
on:
  workflow_dispatch:
    inputs:
      os:
        description: 'Operating systems (JSON list): ubuntu-2404, ubuntu-2604, debian-13'
        default: '["ubuntu-2604", "debian-13"]'
        required: true
      kubernetes:
        description: 'Kubernetes versions (JSON list)'
        default: '["v1.35.9", "v1.36.5"]'
        required: true
      smoke-test:
        description: 'Boot every image and run kubeadm init'
        type: boolean
        default: true
      retention-days:
        description: 'Days to keep the image artifacts'
        default: '3'
        required: true
      release:
        description: 'Publish the images as a GitHub release (needs all builds to succeed)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.os }} / ${{ matrix.kubernetes }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.os) }}
        kubernetes: ${{ fromJSON(inputs.kubernetes) }}
    env:
      TMPDIR: /tmp
    steps:
      - uses: actions/checkout@v7

      - name: Enable KVM for the runner user
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Install QEMU for the smoke test
        if: inputs.smoke-test
        run: |
          sudo apt-get update -q
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q --no-install-recommends \
            qemu-utils qemu-system-x86 cloud-image-utils socat

      # The build runs in a Debian 13 container (libguestfs 1.54); see build-in-container.sh.
      - name: Build
        run: ./build-in-container.sh "${{ matrix.os }}" "${{ matrix.kubernetes }}"

      - name: Smoke test (boot with NoCloud, kubeadm init)
        if: inputs.smoke-test
        run: ./smoke-test.sh "output/${{ matrix.os }}-kube-${{ matrix.kubernetes }}.qcow2"

      - name: Diagnostics on failure
        if: failure()
        run: |
          df -h / /tmp

      - name: Upload image
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.os }}-kube-${{ matrix.kubernetes }}
          path: |
            output/${{ matrix.os }}-kube-${{ matrix.kubernetes }}.qcow2
            output/${{ matrix.os }}-kube-${{ matrix.kubernetes }}.qcow2.sha256
          retention-days: ${{ inputs.retention-days }}
          compression-level: 0
          if-no-files-found: error

  release:
    name: Release
    needs: build
    if: inputs.release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          OS_LIST: ${{ inputs.os }}
          K8S_LIST: ${{ inputs.kubernetes }}
        run: |
          set -euo pipefail
          cd dist
          sha256sum -c ./*.sha256
          cat ./*.sha256 > SHA256SUMS && rm ./*.sha256
          tag="images-$(date -u +%Y%m%d)-${GITHUB_RUN_NUMBER}"
          {
            echo "Cluster API node images for kubeadm, built from stock cloud images with virt-customize"
            echo "and smoke-tested (NoCloud boot, QEMU guest agent, \`kubeadm init\`)."
            echo
            echo "| Image | Size |"
            echo "| --- | --- |"
            for f in *.qcow2; do echo "| \`$f\` | $(du -h "$f" | cut -f1) |"; done
            echo
            echo "Operating systems: ${OS_LIST} · Kubernetes: ${K8S_LIST}"
            echo "containerd ${CONTAINERD_VERSION:-2.4.2}, runc ${RUNC_VERSION:-1.5.2}; details in \`/etc/capi-image-release\`."
            echo
            echo "Verify: \`sha256sum -c SHA256SUMS\`. Proxmox VE import: see README."
            echo
            echo "Built by run [${GITHUB_RUN_ID}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}) from ${GITHUB_SHA::7}."
          } > notes.md
          gh release create "$tag" -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Node images $(date -u +%Y-%m-%d) (run ${GITHUB_RUN_NUMBER})" \
            --notes-file notes.md ./*.qcow2 SHA256SUMS
          echo "Released $tag"
