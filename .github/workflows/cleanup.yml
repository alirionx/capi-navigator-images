name: Clean up releases

# Deletes released images the rule in versions.env no longer keeps, and every build of an image
# but its newest (cleanup.sh). Runs after each release of "Build node images"; started by hand it is
# a dry run unless switched off.
on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Only print what would be deleted'
        type: boolean
        default: true
  workflow_call:
    inputs:
      dry-run:
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  cleanup:
    name: Cleanup
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Delete what the rule no longer keeps
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry-run }}
        run: ./cleanup.sh
